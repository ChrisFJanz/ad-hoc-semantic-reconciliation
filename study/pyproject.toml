[project]
name = "ad-hoc-semantic-reconciliation"
version = "0.1.0"
description = "A study harness for ad hoc semantic reconciliation between divergent network models, using shared references and cognitive agents."
authors = [{ name = "Christopher Janz" }]
requires-python = ">=3.10"
dependencies = []  # the walking skeleton is standard-library only

[project.optional-dependencies]
dev = ["pytest>=7"]
openai = ["openai>=1.40", "pydantic>=2"]  # language-model agent stacks; structured outputs use pydantic

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
